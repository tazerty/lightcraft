# SPDX-License-Identifier: MIT
# Evora — configuration de cargo-about : génère LICENSES/THIRD-PARTY-LICENSES.txt de l'artefact web
# (licences des crates Rust compilées dans le .wasm). Mêmes licences admises que deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
targets = ["wasm32-unknown-unknown"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Exceptions par crate (mêmes que deny.toml) : licences de polices des polices embarquées par egui,
# et licence IJG de l'encodeur JPEG (mention exigée, faite par ce fichier).
[epaint_default_fonts]
accepted = ["OFL-1.1", "Ubuntu-font-1.0"]

[jpeg-encoder]
accepted = ["IJG"]
