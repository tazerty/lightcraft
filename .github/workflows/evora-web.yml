# CI web d'Evora pour le fork tazerty/lightcraft (futur moteur d'Evora Revela).
#
# Écrite par Evora à partir de packaging/web/package.sh, packaging/env.sh, xtask/src/web.rs et
# docs/web.md de l'amont (MIT OR Apache-2.0). Rien n'est repris de storytold/craft-common-actions.
# Règles : aucune action tierce (seulement actions/checkout, actions/cache, actions/upload-artifact,
# épinglées par SHA complet), toolchain Rust installée par rustup à version exacte, outils de build
# installés à version exacte (cargo install --locked), permissions en lecture seule, aucun secret.
#
# Sortie : artefact Actions « evora-revela-web-<tag> » contenant evora-revela-web-<tag>.zip,
# csp-hashes.txt, SHA256SUMS et BUILD-INFO.txt (le zip porte le site, ses copies .gz/.br et LICENSES/).
# Le nom Evora n'est pris qu'une fois E1 posé et toutes les portes au vert (run 38369456468, EVORA-REV-05).
#
# Portes (ARCHITECTURE §3.4), toutes BLOQUANTES depuis E1 : chaque porte tourne même si une autre a
# échoué (continue-on-error), et l'étape « Verdict des portes » fait échouer le job si une seule est
# rouge ; l'archive n'est déposée qu'au vert. Les instruments maison (.github/evora/*.mjs) prouvent
# d'abord qu'ils savent rougir (auto-tests sur paquets piégés, témoin vert), et le test de fumée est
# saboté une fois par exécution.
#
# Pont EHP (E4, avec le correctif E5) : le test de fumée joue « pont-ehp » (coquille minimale d'une
# autre origine, evora-host.json admis écrit par le banc, messages de version 2, d'une origine non
# admise et d'une autre fenêtre sans réponse, stockage amorcé puis purgé au démarrage, ouverture d'une
# photo reçue en octets, langue et thème à chaud, purges current et all vérifiées au moment de
# l'accusé, aucune écriture en séance ni après purge), « pont-muet » (evora-host.json de l'artefact,
# vide) et « hors-pont » (comportement amont, ?storageNs= ignoré). Le même banc est rejoué à chaque
# exécution contre des moteurs factices (.github/evora/ehp-bench.mjs) et contre le vrai moteur sabordé
# (effacements sans effet dans sa page) : le conforme doit rester vert et chaque défaut doit rougir
# avec son étiquette, sinon le job est rouge.
#
# Pont d'enregistrement de Revela (EVORA-REV-29, banc EVORA-REV-30) : « pont-ehp » exerce aussi les
# documents de la coquille (un docRef par photo, evora:dirty, evora:active, evora:activate), la
# machine d'enregistrement (enveloppe revela-save, evora:saved refusé, photo changée pendant l'envoi,
# « clean »), revela.apply par réglages et par sidecar XMP, la liste blanche des commandes, l'export
# de deux photos vers Drive (docRef de chaque fichier, aucun téléchargement), le sélecteur d'Evora,
# F6 (evora:focus-out) et Ctrl+S ; dix moteurs factices de plus portent chacun un de ces défauts.
name: Evora web

on:
  push:
    branches: ["evora/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evora-web-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tag amont épinglé et son commit (D-19) ; la branche doit s'appeler evora/<UPSTREAM_TAG>.
  UPSTREAM_TAG: v0.14.0
  UPSTREAM_COMMIT: 03c88c166c054c009db2a47187d59991f6232b85
  # Aucun rust-toolchain(.toml) dans le dépôt : version stable exacte, celle du job « Web (wasm) »
  # réussi de la release amont v0.14.0 (run 40197629258, rustc 1.99.1), conforme au README amont
  # (Rust >= 1.95) et au rust-version du Cargo.toml (1.95).
  RUST_VERSION: "1.99.1"
  # Doit être égal à la version de wasm-bindgen dans Cargo.lock (cargo xtask web le vérifie).
  WASM_BINDGEN_VERSION: "0.2.129"
  # storytold/craft-fonts à la révision du release.yml amont au tag (« bump deliberately ») ; depuis
  # v0.9.1, crates/engine/build.rs exige Noto Sans Thai Regular quand CRAFT_FONTS_REQUIRED est posé,
  # et depuis v0.14.0 le module web embarque aussi Noto Sans Georgian (présente à cette révision).
  CRAFT_FONTS_REV: a71c20e30af613287c504f7e685ca8fad77752bc
  # Outils des portes : binaires officiels épinglés par version ET par empreinte (digest publié par
  # GitHub pour l'asset de la release, relu le 2026-10-13).
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  CARGO_ABOUT_VERSION: "0.9.2"
  CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  web:
    name: Web (wasm) Evora
    # Image épinglée : le libellé ubuntu-latest bascule vers Ubuntu 26 à partir du 2026-10-19
    # (avis de GitHub dans les journaux) ; Chrome et Node du test de fumée viennent de cette image.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        # Shell explicite : « bash --noprofile --norc -eo pipefail {0} » (le défaut implicite est « bash -e », sans pipefail).
        shell: bash
    steps:
      - name: Récupération du fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Récupération de craft-fonts (révision épinglée)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REV }}
          path: craft-fonts
          persist-credentials: false

      - name: Contrôle de la branche, du tag et du commit amont
        id: meta
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            evora/*) ;;
            *) echo "::error::branche $GITHUB_REF_NAME hors du motif evora/<tag>"; exit 1 ;;
          esac
          TAG="${GITHUB_REF_NAME#evora/}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag « $TAG » invalide"; exit 1
          fi
          if [ "$TAG" != "$UPSTREAM_TAG" ]; then
            echo "::error::la branche vise $TAG mais UPSTREAM_TAG vaut $UPSTREAM_TAG : mettre le workflow à jour"; exit 1
          fi
          if ! git merge-base --is-ancestor "$UPSTREAM_COMMIT" HEAD; then
            echo "::error::$UPSTREAM_COMMIT (tag $UPSTREAM_TAG) n'est pas un ancêtre de HEAD"; exit 1
          fi
          VERSION="$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Cargo.toml annonce $VERSION, incompatible avec le tag $TAG"; exit 1
          fi
          LOCKED_WB="$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          if [ "$LOCKED_WB" != "$WASM_BINDGEN_VERSION" ]; then
            echo "::error::Cargo.lock fixe wasm-bindgen $LOCKED_WB, le workflow $WASM_BINDGEN_VERSION"; exit 1
          fi
          EVORA_COMMITS="$(git rev-list --count "$UPSTREAM_COMMIT..HEAD")"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "evora_commits=$EVORA_COMMITS"
          } >> "$GITHUB_OUTPUT"
          echo "branche $GITHUB_REF_NAME, tag $TAG ($UPSTREAM_COMMIT), version $VERSION, $EVORA_COMMITS commit(s) Evora"

      - name: Installation de Rust (rustup, version exacte)
        run: |
          set -euo pipefail
          rustup --version
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version
          rustup target list --installed

      - name: Cache du registre Cargo et des outils
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.evora-tools
          key: evora-web-cargo-${{ runner.os }}-rust${{ env.RUST_VERSION }}-wb${{ env.WASM_BINDGEN_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            evora-web-cargo-${{ runner.os }}-rust${{ env.RUST_VERSION }}-wb${{ env.WASM_BINDGEN_VERSION }}-

      - name: Cache du dossier target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: evora-web-target-${{ runner.os }}-rust${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            evora-web-target-${{ runner.os }}-rust${{ env.RUST_VERSION }}-

      - name: Installation de wasm-bindgen-cli (version exacte)
        run: |
          set -euo pipefail
          TOOLS="$HOME/.evora-tools"
          have="$("$TOOLS/bin/wasm-bindgen" --version 2>/dev/null | awk '{print $2}' || true)"
          if [ "$have" != "$WASM_BINDGEN_VERSION" ]; then
            cargo install wasm-bindgen-cli --version "=$WASM_BINDGEN_VERSION" --locked --root "$TOOLS" --force
          fi
          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          "$TOOLS/bin/wasm-bindgen" --version

      - name: Installation de cargo-deny et cargo-about (binaires épinglés, empreintes vérifiées)
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/evora-bin"; mkdir -p "$BIN"
          fetch() { # $1 dépôt, $2 nom, $3 version, $4 sha256 de l'archive
            local tgz="$2-$3-x86_64-unknown-linux-musl.tar.gz" dir="$RUNNER_TEMP/evora-tools-$2"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tgz" "https://github.com/$1/releases/download/$3/$tgz"
            echo "$4  $RUNNER_TEMP/$tgz" | sha256sum -c -
            mkdir -p "$dir"
            tar -xzf "$RUNNER_TEMP/$tgz" -C "$dir"
            local exe
            exe="$(find "$dir" -type f -name "$2" | head -n 1)"
            [ -n "$exe" ] || { echo "::error::$2 introuvable dans $tgz"; exit 1; }
            install -m 0755 "$exe" "$BIN/$2"
            "$BIN/$2" --version | tee /dev/stderr | grep -qF "$3" || { echo "::error::$2 n'annonce pas la version $3"; exit 1; }
          }
          fetch EmbarkStudios/cargo-deny cargo-deny "$CARGO_DENY_VERSION" "$CARGO_DENY_SHA256"
          fetch EmbarkStudios/cargo-about cargo-about "$CARGO_ABOUT_VERSION" "$CARGO_ABOUT_SHA256"
          echo "$BIN" >> "$GITHUB_PATH"
          node --version

      - name: Auto-tests des instruments de porte (chaque porte doit savoir rougir)
        run: |
          set -euo pipefail
          node .github/evora/bundle-gates.mjs selftest
          node .github/evora/catalog-audit.mjs --selftest
          node .github/evora/advisory-guards.mjs --selftest
          node .github/evora/feature-guards.mjs --selftest

      - name: Portes E10 et E9 — émojis et termes sensibles des catalogues affichés
        id: g_emoji
        continue-on-error: true
        run: node .github/evora/catalog-audit.mjs . --rust-blocking --terms-blocking --summary "$GITHUB_STEP_SUMMARY"

      - name: Porte cargo-deny — licences, avis de sécurité, sources
        id: g_deny
        continue-on-error: true
        run: |
          set -euo pipefail
          # Les avis ignorés dans deny.toml ne le sont qu'à la condition revérifiée ici.
          node .github/evora/advisory-guards.mjs .
          cargo deny --manifest-path apps/lightcraft-web/Cargo.toml --config .github/evora/deny.toml --locked --color never \
            check --show-stats advisories licenses sources 2>&1 | tee "$RUNNER_TEMP/cargo-deny.txt"

      - name: Porte E7 — neutralisations du graphe web (HEIF, SAM 3, débruitage IA, RawNIND)
        id: g_e7
        continue-on-error: true
        run: |
          set -euo pipefail
          # Résolution des features du seul paquet web pour la cible du navigateur, comme le build.
          cargo tree -p lightcraft-web --target wasm32-unknown-unknown -e normal,features --prefix none --locked > "$RUNNER_TEMP/web-tree.txt"
          node .github/evora/feature-guards.mjs "$RUNNER_TEMP/web-tree.txt"

      - name: Porte cargo-about — LICENSES/ des crates tierces
        id: g_about
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo about generate --manifest-path apps/lightcraft-web/Cargo.toml --locked --fail \
            -c .github/evora/about.toml -o "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" .github/evora/about.hbs 2>&1 | tee "$RUNNER_TEMP/cargo-about.txt"
          test -s "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt"
          echo "THIRD-PARTY-LICENSES.txt : $(wc -c < "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt") octets, $(grep -c '^- ' "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt") lignes de liste"

      - name: Build web (cargo xtask web, profil web)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          LIGHTCRAFT_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export LIGHTCRAFT_BUILD_DATE="$(date -u +%Y-%m-%d)"
          # Le dossier du site est régénéré à chaque build : rien ne survit d'un cache précédent.
          if [ -e target/web-site ]; then mv target/web-site "$RUNNER_TEMP/web-site-from-cache"; fi
          wasm-bindgen --version
          cargo xtask web
          ls -la target/web-site

      - name: Empaquetage du site statique
        id: pkg
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          EVORA_COMMITS: ${{ steps.meta.outputs.evora_commits }}
        run: |
          set -euo pipefail
          SITE="target/web-site"
          NAME="evora-revela-web-$TAG"
          OUT="$GITHUB_WORKSPACE/dist/evora"
          WORK="$RUNNER_TEMP/evora-package"
          [ -f "$SITE/index.html" ] || { echo "::error::$SITE/index.html absent"; exit 1; }
          # Garde reprise de package.sh (#793) : aucun artefact Cargo dans le site.
          for d in deps build .fingerprint; do
            if [ -e "$SITE/$d" ]; then echo "::error::$SITE/$d présent : artefacts Cargo dans le site (#793)"; exit 1; fi
          done
          # Garde reprise de package.sh : URL relatives seulement (service sous un sous-chemin et en iframe).
          if grep -Eq '(src|href)="/[^/]' "$SITE/index.html"; then
            echo "::error::$SITE/index.html contient des URL absolues depuis la racine"; exit 1
          fi
          # Le site produit par xtask est plat : un sous-dossier ou un lien symbolique signale un changement amont à relire.
          odd="$(find "$SITE" -mindepth 1 \( -type d -o -type l \) -print)"
          if [ -n "$odd" ]; then echo "::error::structure inattendue dans $SITE :"; echo "$odd"; exit 1; fi
          mkdir -p "$WORK/$NAME/LICENSES" "$OUT"
          # Copie des fichiers réguliers du site (avec leurs copies .gz/.br produites par xtask), sans fichiers
          # cachés ni fichiers d'hébergement (ni _headers ni .htaccess ni HOSTING.md : Evora pose ses propres en-têtes).
          find "$SITE" -maxdepth 1 -type f ! -name '.*' ! -name '_headers' ! -name '*.conf' -exec cp {} "$WORK/$NAME/" \;
          # Licences et mentions (logique copy_docs et copy_font_licences de packaging/env.sh, README exclu).
          for f in LICENSE LICENSE-MIT LICENSE-APACHE COPYRIGHT NOTICE assets/ATTRIBUTION.md; do
            if [ -f "$f" ]; then cp "$f" "$WORK/$NAME/LICENSES/"; fi
          done
          # E1 : mention en texte simple « basé sur LightCraft par l'équipe ArtCraft » (licence de marque amont).
          cp packaging/evora/NOTICE-EVORA.txt "$WORK/$NAME/LICENSES/"
          for lic in craft-fonts/fonts/*/OFL.txt; do
            [ -f "$lic" ] || continue
            cp "$lic" "$WORK/$NAME/LICENSES/OFL-$(basename "$(dirname "$lic")").txt"
          done
          # Licences des crates tierces compilées dans le .wasm (porte cargo-about) ; absentes = porte rouge.
          if [ -s "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" ]; then
            cp "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" "$WORK/$NAME/LICENSES/"
          else
            echo "::warning::THIRD-PARTY-LICENSES.txt absent (porte cargo-about en échec)"
          fi
          # E4 : origines parentes admises par le pont EHP (?host=evora). Vide dans l'artefact : le
          # provisionnement d'Evora l'écrit depuis engines.json (HOST-PROTOCOL §2.3) ; vide, le pont reste muet.
          printf '{"parentOrigins": []}\n' > "$WORK/$NAME/evora-host.json"
          # Empreintes CSP des scripts inline, écrites dans le bundle avant l'archive (un problème relevé
          # ici est jugé par la porte du bundle, qui tourne quoi qu'il arrive).
          node .github/evora/bundle-gates.mjs csp "$WORK/$NAME" || echo "::warning::empreintes CSP : problème relevé, voir la porte du bundle"
          (cd "$WORK" && zip -qr9X "$OUT/$NAME.zip" "$NAME")
          cp "$WORK/$NAME/csp-hashes.txt" "$OUT/csp-hashes.txt"
          (cd "$OUT" && sha256sum "$NAME.zip" csp-hashes.txt > SHA256SUMS)
          WASM="$WORK/$NAME/lightcraft_web_bg.wasm"
          {
            echo "artefact: $NAME.zip"
            echo "fork: $GITHUB_REPOSITORY"
            echo "branche: $GITHUB_REF_NAME"
            echo "commit: $GITHUB_SHA"
            echo "tag amont: $UPSTREAM_TAG"
            echo "commit amont: $UPSTREAM_COMMIT"
            echo "commits Evora au-dessus du tag: $EVORA_COMMITS"
            echo "version Cargo: $VERSION"
            echo "rustc: $(rustc --version)"
            echo "cargo: $(cargo --version)"
            echo "wasm-bindgen: $(wasm-bindgen --version)"
            echo "craft-fonts: $CRAFT_FONTS_REV"
            echo "cargo-deny: $(cargo-deny --version) ; cargo-about: $(cargo-about --version)"
            echo "wasm-opt: $(command -v wasm-opt >/dev/null && wasm-opt --version || echo absent)"
            echo "image du runner: ${ImageOS:-?} ${ImageVersion:-?} ; node: $(node --version) ; chrome: $(google-chrome --version 2>/dev/null || echo absent)"
            echo "exécution: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (essai $GITHUB_RUN_ATTEMPT)"
            echo "date UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sha256 $NAME.zip: $(sha256sum "$OUT/$NAME.zip" | cut -d' ' -f1)"
            echo "sha256 lightcraft_web_bg.wasm: $(sha256sum "$WASM" | cut -d' ' -f1)"
          } > "$OUT/BUILD-INFO.txt"
          cat "$OUT/BUILD-INFO.txt" "$OUT/SHA256SUMS"
          ls -la "$OUT"
          {
            echo "name=$NAME"
            echo "zip=$OUT/$NAME.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Extraction de l'archive (les portes jugent l'artefact, pas le dossier de travail)
        id: unpacked
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          ZIP: ${{ steps.pkg.outputs.zip }}
        run: |
          set -euo pipefail
          V="$RUNNER_TEMP/evora-verify"
          mkdir -p "$V" "$RUNNER_TEMP/evora-diag"
          unzip -q "$ZIP" -d "$V"
          echo "dir=$V/$NAME" >> "$GITHUB_OUTPUT"
          find "$V" -maxdepth 2 | sort | head -50

      - name: Portes du bundle — marques, hébergement, .gz/.br, CSP, taille
        id: g_bundle
        continue-on-error: true
        run: |
          node .github/evora/bundle-gates.mjs check "${{ steps.unpacked.outputs.dir }}" --zip "${{ steps.pkg.outputs.zip }}" \
            --summary "$GITHUB_STEP_SUMMARY" --json "$RUNNER_TEMP/evora-diag/bundle-gates.json"

      - name: Porte E6 — polices (craft-fonts épinglé, police chinoise servie à part)
        id: g_e6
        continue-on-error: true
        env:
          DIR: ${{ steps.unpacked.outputs.dir }}
        run: |
          set -euo pipefail
          have="$(git -C craft-fonts rev-parse HEAD)"
          [ "$have" = "$CRAFT_FONTS_REV" ] || { echo "::error::craft-fonts à $have, épinglé à $CRAFT_FONTS_REV"; exit 1; }
          # la face chinoise du manifeste de craft-fonts (même lecture que xtask/src/web.rs)
          line="$(awk -F'|' '{ for (i = 1; i <= NF; i++) gsub(/^ +| +$/, "", $i) } $1 == "Noto Sans CJK SC" && $2 == "Regular" { print $3 "|" $6 "|" $7; exit }' craft-fonts/fonts/manifest.txt)"
          [ -n "$line" ] || { echo "::error::Noto Sans CJK SC Regular absente du manifeste de craft-fonts"; exit 1; }
          IFS='|' read -r font_path lic_path pinned <<< "$line"
          src="craft-fonts/$font_path"; lic="craft-fonts/$lic_path"
          served="$DIR/lightcraft_zh_hans.otf"
          [ -f "$served" ] || { echo "::error::police chinoise absente de l'archive"; exit 1; }
          a="$(sha256sum "$src" | cut -d' ' -f1)"; b="$(sha256sum "$served" | cut -d' ' -f1)"
          [ "$a" = "$b" ] || { echo "::error::lightcraft_zh_hans.otf ($b) diffère de la face de craft-fonts ($a)"; exit 1; }
          [ "$b" = "$pinned" ] || { echo "::error::lightcraft_zh_hans.otf ($b) diffère de l'empreinte du manifeste ($pinned)"; exit 1; }
          cmp -s "$lic" "$DIR/OFL-noto-sans-cjk-sc.txt" || { echo "::error::licence OFL de la police chinoise absente ou différente"; exit 1; }
          n_ofl="$(find "$DIR/LICENSES" -name 'OFL-*.txt' | wc -l)"
          wasm="$(stat -c %s "$DIR/lightcraft_web_bg.wasm")"; font="$(stat -c %s "$served")"
          {
            echo "### Porte E6 : polices"
            echo
            echo "- craft-fonts : $have (épinglé)"
            echo "- police chinoise servie à part : lightcraft_zh_hans.otf, $font o, sha256 $b, identique à $font_path de craft-fonts et à l'empreinte de son manifeste"
            echo "- licence : OFL-noto-sans-cjk-sc.txt identique à $lic_path ; $n_ofl fichiers OFL dans LICENSES/"
            echo "- module wasm (Inter, police japonaise BIZ UDPGothic, polices thaïe Noto Sans Thai et géorgienne Noto Sans Georgian embarquées) : $wasm o"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test de fumée — sabotage CSP (doit échouer)
        id: g_smoke_sabotage
        continue-on-error: true
        run: |
          set +e   # l'échec attendu du sabotage ne doit pas interrompre l'étape
          set -uo pipefail
          node .github/evora/smoke.mjs --site "${{ steps.unpacked.outputs.dir }}" --out "$RUNNER_TEMP/evora-diag/sabotage" \
            --timeout 60 --scenario 'sabotage-csp||' --sabotage-csp
          code=$?
          if [ "$code" -eq 0 ]; then echo "::error::le test de fumée n'a pas rougi sous sabotage CSP : instrument aveugle"; exit 1; fi
          echo "Sabotage CSP : le test de fumée a bien échoué (code $code)."

      - name: Porte test de fumée — Chrome sans interface, iframe d'une autre origine, audit de rendu E10 et E9, pont EHP
        id: g_smoke
        continue-on-error: true
        run: |
          set -euo pipefail
          node .github/evora/smoke.mjs --site "${{ steps.unpacked.outputs.dir }}" --out "$RUNNER_TEMP/evora-diag/smoke" --timeout 150 \
            --render-audit --terms-blocking --repo "$GITHUB_WORKSPACE" \
            | tee "$RUNNER_TEMP/evora-diag/smoke.txt"

      - name: Témoins du pont EHP — moteurs factices et vrai moteur sabordés (chaque défaut doit rougir, le conforme rester vert)
        id: g_ehp_witness
        if: ${{ !cancelled() && steps.unpacked.outcome == 'success' }}
        run: |
          set -euo pipefail
          node .github/evora/smoke.mjs --site "${{ steps.unpacked.outputs.dir }}" --out "$RUNNER_TEMP/evora-diag/ehp-witness" --ehp-witness \
            | tee "$RUNNER_TEMP/evora-diag/ehp-witness.txt"

      - name: Verdict des portes
        if: ${{ !cancelled() }}
        env:
          EMOJI: ${{ steps.g_emoji.outcome }}
          DENY: ${{ steps.g_deny.outcome }}
          E7: ${{ steps.g_e7.outcome }}
          E6: ${{ steps.g_e6.outcome }}
          ABOUT: ${{ steps.g_about.outcome }}
          BUNDLE: ${{ steps.g_bundle.outcome }}
          SABOTAGE: ${{ steps.g_smoke_sabotage.outcome }}
          SMOKE: ${{ steps.g_smoke.outcome }}
          WITNESS: ${{ steps.g_ehp_witness.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### Verdict des portes"
            echo
            echo "| Porte | Résultat |"
            echo "|---|---|"
            echo "| E10 émojis et E9 termes sensibles (catalogues affichés, code d'interface) | $EMOJI |"
            echo "| cargo-deny (licences, avis, sources) | $DENY |"
            echo "| E7 neutralisations du graphe web | $E7 |"
            echo "| E6 polices (craft-fonts épinglé, police chinoise à part) | $E6 |"
            echo "| cargo-about (LICENSES/ des crates) | $ABOUT |"
            echo "| Bundle (marques, hébergement, .gz/.br, CSP, taille) | $BUNDLE |"
            echo "| Sabotage CSP du test de fumée (doit rougir) | $SABOTAGE |"
            echo "| Test de fumée (autre origine, démarrage à froid, audit de rendu E10 et E9, pont EHP E4/E5) | $SMOKE |"
            echo "| Témoins du pont EHP (moteurs factices et vrai moteur sabordés : conforme vert, chaque défaut rouge) | $WITNESS |"
            echo
            echo "Avertissements de cargo-deny : $(awk '/^warning/ { n++ } END { print n + 0 }' "$RUNNER_TEMP/cargo-deny.txt" 2>/dev/null || echo '?') (détail dans le journal de la porte)."
          } >> "$GITHUB_STEP_SUMMARY"
          for v in "$EMOJI" "$DENY" "$E7" "$E6" "$ABOUT" "$BUNDLE" "$SABOTAGE" "$SMOKE" "$WITNESS"; do
            if [ "$v" != "success" ]; then echo "::error::au moins une porte est rouge : voir le résumé du job"; exit 1; fi
          done
          echo "Toutes les portes sont vertes."

      - name: Dépôt de l'artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/evora/
          if-no-files-found: error

      - name: Dépôt des diagnostics (captures du test de fumée, rapports)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evora-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/evora-diag/
            ${{ runner.temp }}/cargo-deny.txt
            ${{ runner.temp }}/cargo-about.txt
          if-no-files-found: warn
          retention-days: 30
